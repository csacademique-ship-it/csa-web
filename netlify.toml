# Deploiement Netlify — voir docs/04-deploiement.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Entetes de securite et de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ATTENTION — ne pas remettre "immutable" ici.
# Nos fichiers ne portent pas d'empreinte dans leur nom : c'est toujours
# "csa.css", jamais "csa.a1b2c3.css". Or "immutable" ordonne au navigateur
# de garder le fichier un an SANS jamais revenir verifier.
# Consequence vecue le 26 aout 2026 : config.js, qui contient l'adresse du
# formulaire, restait fige sur l'ancienne version et les inscriptions
# affichaient "formulaire pas encore connecte" chez tout visiteur deja venu.
# Netlify envoie un ETag : revalider ne coute presque rien (reponse 304).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# L'adresse du formulaire vit dans ce fichier. Aucun cache, jamais.
[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "no-store"

# Les images changent rarement, mais elles doivent pouvoir etre remplacees
# sans attendre un an : une journee de cache suffit.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les anciennes adresses du site restent valides
[[redirects]]
  from = "/formation/*"
  to = "/formations/:splat"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/inscription.html"
  status = 301
